{{define "auth"}}<!DOCTYPE html>
<html lang="en" class="dark"><head>{{template "head" .}}</head>
<body class="min-h-screen bg-zinc-50 dark:bg-zinc-800 text-zinc-800 dark:text-zinc-100 antialiased">
<div class="flex min-h-screen flex-col items-center justify-center gap-6 p-4 md:p-10">
  <a href="/" class="flex items-center gap-2 font-medium"><span class="grid size-9 place-items-center rounded-md bg-zinc-900 text-white dark:bg-white dark:text-zinc-900">D</span></a>
  <div class="w-full max-w-sm rounded-xl border border-zinc-200 bg-white p-8 shadow-sm dark:border-zinc-700 dark:bg-zinc-900">
    <div class="mb-6 text-center"><h1 class="text-xl font-semibold">{{template "title" .}}</h1><p class="text-sm text-zinc-500">{{block "subtitle" .}}{{end}}</p></div>
    {{with .Flash}}<p class="mb-4 text-center text-sm text-emerald-600">{{printf "%s" .}}</p>{{end}}
    {{with .Status}}<p class="mb-4 text-center text-sm text-emerald-600">{{.}}</p>{{end}}
    {{with .Error}}<p class="mb-4 text-center text-sm text-red-500">{{.}}</p>{{end}}
    {{template "content" .}}
  </div>
</div></body></html>{{end}}
{{define "btn"}}<button type="submit" class="inline-flex h-10 w-full items-center justify-center rounded-lg bg-zinc-800 px-4 text-sm font-medium text-white shadow-xs hover:bg-zinc-700 dark:bg-white dark:text-zinc-800 dark:hover:bg-zinc-200">{{.}}</button>{{end}}
